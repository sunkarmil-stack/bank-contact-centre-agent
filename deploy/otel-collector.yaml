receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  # Defense in depth: drop any attribute that might carry raw content
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: enduser.id
        action: hash

exporters:
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
  debug:
    verbosity: basic
  # azuremonitor:
  #   connection_string: ${env:APPLICATIONINSIGHTS_CONNECTION_STRING}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/scrub, batch]
      exporters: [otlphttp/phoenix, debug]
